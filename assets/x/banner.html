<!doctype html>
<!--
  X header for Zolva, 1500 x 500. Rendered to x-profile-header-1500x500.png with
  headless Edge (see docs/x/profile.md). Safe zones: the avatar covers the bottom
  left on desktop and phones crop about 40px per side, so content sits centre right.
  The decision card is a real trade (Lab · Trio RSI Dip, 2026-10-15 11:00 UTC).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=block" rel="stylesheet" />
    <style>
      :root {
        --bg: #f3f2ff;
        --text: #252228;
        --muted: rgba(37, 34, 40, 0.65);
        --faint: #8f8e8e;
        --line: #e1e1e0;
        --purple: #8075ff;
        --purple-soft: #e5e5ff;
        --gain: #0a9a4c;
        --gain-soft: #e6f8ee;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1500px; height: 500px; overflow: hidden; }
      body {
        position: relative;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
      }
      /* Soft orb shapes in the brand purple, flat colours only. */
      .shape { position: absolute; border-radius: 9999px; background: var(--purple-soft); }
      .shape--a { width: 520px; height: 520px; right: -140px; top: -220px; }
      .shape--b { width: 260px; height: 260px; left: 120px; top: -150px; opacity: 0.7; }
      .content {
        position: absolute;
        left: 430px;
        right: 80px;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 48px;
      }
      .copy { max-width: 520px; }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      .brand img { width: 40px; height: 40px; }
      h1 { margin-top: 24px; font-size: 48px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em; text-wrap: balance; }
      .lead { margin-top: 16px; color: var(--muted); font-size: 20px; line-height: 28px; text-wrap: pretty; }
      .card {
        width: 380px;
        flex: none;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(37, 34, 40, 0.05), 0 24px 48px -16px rgba(37, 34, 40, 0.14);
      }
      .card__top { display: flex; align-items: center; justify-content: space-between; }
      .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 9999px; font-size: 13px; font-weight: 600; }
      .pill--buy { background: var(--gain-soft); color: var(--gain); }
      .pill--paper { background: var(--purple-soft); color: var(--purple); }
      .dot { width: 6px; height: 6px; border-radius: 9999px; background: currentColor; }
      .symbol { margin-top: 16px; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
      .agent { margin-top: 4px; color: var(--faint); font-size: 14px; }
      .why { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 16px; line-height: 24px; }
      .why span { color: var(--muted); }
      .time { margin-top: 12px; color: var(--faint); font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="shape shape--a"></div>
    <div class="shape shape--b"></div>
    <div class="content">
      <div class="copy">
        <div class="brand"><img src="../../public/img/brand/zolva-mark.png" alt="" />Zolva</div>
        <h1>Trading agents that show their work</h1>
        <p class="lead">Build one without code. It trades tokenized US stocks on Robinhood Chain and explains every decision.</p>
      </div>
      <div class="card">
        <div class="card__top">
          <span class="pill pill--buy"><span class="dot"></span>BUY</span>
          <span class="pill pill--paper">Paper trading</span>
        </div>
        <div class="symbol">NVDA</div>
        <div class="agent">Lab · Trio RSI Dip</div>
        <p class="why">Buy rule met: 24h RSI 25 below 30. <span>Buying.</span></p>
        <p class="time">Oct 15, 11:00 UTC · price from the onchain pool</p>
      </div>
    </div>
  </body>
</html>
