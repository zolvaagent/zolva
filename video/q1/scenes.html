<!doctype html>
<!--
  Frames for the Q1 video (1920 x 1080). Open with ?scene=build|test|why|end, or
  ?caption=<text> for a transparent caption overlay. Rendered with headless Edge.
  The "why" cards are a real decision (2026-10-18 16:00 UTC, GME, AI co-pilot passed).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=block" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <style>
      :root {
        --text: #f6f7f4;
        --muted: rgba(246, 247, 244, 0.62);
        --faint: rgba(246, 247, 244, 0.4);
        --line: rgba(255, 255, 255, 0.09);
        --purple: #9896ff;
        --gain: #2fd27a;
        --warn: #ffb35c;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: var(--text); }
      body.scene { background: #121116; }
      body.caption { background: transparent; }
      .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1.2px); background-size: 26px 26px; }
      .glow { position: absolute; width: 1400px; height: 1000px; left: 260px; top: -320px; background: radial-gradient(closest-side, rgba(128, 117, 255, 0.38), transparent 75%); }
      .stage { position: absolute; inset: 0 0 200px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
      .tag { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, 0.05); color: var(--muted); font-size: 22px; font-weight: 500; }
      .tag i { color: var(--purple); font-size: 24px; }
      .shot { border-radius: 28px; box-shadow: 0 0 0 1px rgba(152, 150, 255, 0.35), 0 40px 100px -30px rgba(128, 117, 255, 0.6); }
      .shot--prompt { width: 1240px; }
      .shot--test { height: 760px; }

      /* "why": the rule card and the AI card. */
      .story { position: relative; width: 1040px; height: 640px; }
      .card { position: absolute; width: 760px; padding: 36px 42px; border: 1px solid var(--line); border-radius: 34px; background: #1b1922; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.8); }
      .card--rule { left: 0; top: 10px; }
      .card--ai { left: 260px; top: 300px; border-color: rgba(152, 150, 255, 0.55); background: #1f1c2b; box-shadow: 0 0 0 1px rgba(152, 150, 255, 0.18), 0 40px 100px -24px rgba(128, 117, 255, 0.6); }
      .row { display: flex; align-items: center; justify-content: space-between; }
      .label { color: var(--faint); font-size: 22px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
      .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 18px; border-radius: 999px; font-size: 22px; font-weight: 600; }
      .pill--buy { background: rgba(47, 210, 122, 0.14); color: var(--gain); }
      .pill--pass { background: rgba(255, 179, 92, 0.14); color: var(--warn); }
      .symbol { margin-top: 16px; font-size: 48px; font-weight: 600; letter-spacing: -0.02em; }
      .rule-text { margin-top: 8px; color: var(--muted); font-size: 26px; line-height: 36px; }
      .quote { margin-top: 18px; font-size: 38px; line-height: 50px; font-weight: 500; letter-spacing: -0.01em; }
      .meta { margin-top: 18px; display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 22px; }
      .meta i { color: var(--purple); font-size: 24px; }
      .connector { position: absolute; left: 92px; top: 236px; width: 3px; height: 120px; background-image: radial-gradient(circle, var(--purple) 2px, transparent 2.6px); background-size: 3px 11px; }

      /* "end": the brand card. */
      .end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding-bottom: 120px; }
      .end img { width: 220px; height: 220px; filter: drop-shadow(0 30px 60px rgba(128, 117, 255, 0.55)); }
      .end h1 { margin-top: 12px; font-size: 120px; line-height: 1; font-weight: 600; letter-spacing: -0.045em; }
      .end p { color: var(--muted); font-size: 40px; }
      .end .url { margin-top: 18px; padding: 12px 30px; border: 1px solid rgba(152, 150, 255, 0.45); border-radius: 999px; color: #d0ceff; font-size: 30px; font-weight: 500; }

      /* Caption overlay. */
      .cap { position: absolute; left: 0; right: 0; bottom: 76px; display: flex; justify-content: center; }
      .cap span { max-width: 1240px; padding: 16px 34px; border-radius: 20px; background: rgba(10, 9, 14, 0.72); font-size: 50px; line-height: 64px; font-weight: 600; letter-spacing: -0.01em; text-align: center; text-wrap: balance; }
    </style>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(location.search);
      const scene = params.get("scene");
      const caption = params.get("caption");
      const bg = '<div class="dots"></div><div class="glow"></div>';
      const scenes = {
        build: `${bg}<div class="stage"><span class="tag"><i class="ph ph-sparkle"></i>Prompt mode</span><img class="shot shot--prompt" src="crop-prompt.png" alt=""></div>`,
        test: `${bg}<div class="stage"><img class="shot shot--test" src="crop-backtest.png" alt=""></div>`,
        why: `${bg}<div class="stage"><div class="story">
          <div class="card card--rule"><div class="row"><span class="label">Rule signal</span><span class="pill pill--buy">BUY</span></div>
          <div class="symbol">GME</div><p class="rule-text">Near its 3 day low, RSI crosses above 30.</p></div>
          <span class="connector"></span>
          <div class="card card--ai"><div class="row"><span class="label">AI co-pilot</span><span class="pill pill--pass"><i class="ph ph-hand-palm"></i>PASSED</span></div>
          <p class="quote">"Not a clear higher-low bounce. Looks like a falling knife."</p>
          <div class="meta"><i class="ph ph-sparkle"></i>DeepSeek V4.1 Flash · Oct 18, 16:00 UTC</div></div>
        </div></div>`,
        end: `${bg}<div class="end"><img src="../../public/img/brand/zolva-mark.png" alt=""><h1>Zolva</h1><p>Trading agents that show their work.</p><span class="url">zolvaagent.app</span></div>`,
      };
      if (caption) {
        document.body.className = "caption";
        const wrap = document.createElement("div");
        wrap.className = "cap";
        const span = document.createElement("span");
        span.textContent = caption;
        wrap.appendChild(span);
        document.body.appendChild(wrap);
      } else {
        document.body.className = "scene";
        document.body.innerHTML = scenes[scene] ?? "";
      }
    </script>
  </body>
</html>
